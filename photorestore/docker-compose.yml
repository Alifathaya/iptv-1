services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    image: python:3.12-slim
    working_dir: /srv/photorestore
    volumes: [".:/srv/photorestore", "fr-storage:/srv/storage"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/storage
    command: bash -c "pip install fastapi 'uvicorn[standard]' python-multipart redis rq pydantic pillow && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    image: python:3.12-slim
    working_dir: /srv/photorestore
    volumes: [".:/srv/photorestore", "fr-storage:/srv/storage"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /srv/storage
    command: bash -c "pip install redis rq opencv-python-headless pillow numpy && rq worker --path /srv/photorestore --path /srv/photorestore/worker fotorestore"
    depends_on: [redis]
volumes:
  fr-storage:
