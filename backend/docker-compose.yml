services:
  foto-jelas-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: foto-jelas-gpu:latest
    container_name: foto-jelas-gpu
    ports:
      - "8080:8080"
    environment:
      API_KEY: ${API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PIXELS: ${MAX_PIXELS:-16777216}
      TILE_SIZE: ${TILE_SIZE:-512}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - model-weights:/app/weights
    restart: unless-stopped

volumes:
  model-weights:
