services:
  foto-jelas-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: foto-jelas-cpu:latest
    container_name: foto-jelas-cpu
    ports:
      - "8080:8080"
    environment:
      API_KEY: ${API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - model-weights:/app/weights
    restart: unless-stopped

volumes:
  model-weights:
