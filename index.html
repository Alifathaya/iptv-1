<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aina's Calculator">
  <meta name="theme-color" content="#ff69b4">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Aina's Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ff9ec5;
      --surface: #ffb6d5;
      --surface-hover: #ffc9e3;
      --display-bg: #ff85b8;
      --text: #5c0a2e;
      --text-muted: #9e2a5c;
      --operator: #ffffff;
      --function: #ffffff;
      --science: #ffffff;
      --equals: #ffffff;
      --pink-dark: #e91e8c;
      --pink-mid: #ff4da6;
      --pink-hot: #ff69b4;
      --shadow: 0 16px 40px rgba(233, 30, 140, 0.35);
      --radius: 24px;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #ff9ec5 0%, #ff6eb4 45%, #ff85c8 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 0.75rem;
    }
    .calculator {
      width: 100%; max-width: 520px;
      background: linear-gradient(180deg, #ffb6d5 0%, #ff9ec5 100%);
      border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      border: 3px solid #ff4da6;
    }
    .calculator-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem 0.5rem; gap: 0.75rem;
    }
    .logo {
      display: flex; align-items: center; gap: 0.65rem; min-width: 0; flex: 1;
    }
    .logo-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 50%, #ffb6d5 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 20, 147, 0.5);
      border: 2px solid #fff;
    }
    .logo-icon svg { width: 22px; height: 22px; }
    .logo-text { min-width: 0; }
    .logo-title {
      font-size: 1rem; font-weight: 700; line-height: 1.15;
      background: linear-gradient(90deg, #c2185b 0%, #e91e8c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .logo-subtitle {
      font-size: 0.68rem; font-weight: 600; color: #c2185b;
      letter-spacing: 0.06em; text-transform: uppercase; margin-top: 0.1rem;
    }
    .header-controls {
      display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
    }
    .calculator-header h1 { display: none; }
    .mode-toggle {
      border: 2px solid #ff1493; background: #fff;
      color: #e91e8c; font-size: 0.75rem; font-weight: 700;
      padding: 0.35rem 0.65rem; border-radius: 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mode-toggle.active { background: #ff1493; color: #fff; border-color: #ff1493; }
    .second-indicator {
      font-size: 0.7rem; color: #c2185b; font-weight: 700; min-width: 2rem; text-align: right;
    }
    .display {
      padding: 0.75rem 1.25rem 1.25rem;
      background: linear-gradient(180deg, #ff85b8 0%, #ff6eb4 100%);
      border-bottom: 2px solid #ff4da6;
      text-align: right; min-height: 100px;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .expression {
      font-size: 0.95rem; color: #7a1040;
      min-height: 1.25rem; word-break: break-all; margin-bottom: 0.25rem;
    }
    .result {
      font-size: 2.25rem; font-weight: 600; color: #fff;
      text-shadow: 0 2px 8px rgba(194, 24, 91, 0.3);
      word-break: break-all; line-height: 1.1;
    }
    .keypad {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 4px; background: #ff85b8; padding: 4px;
    }
    .btn {
      border: none; background: #ffc9e3; color: #8e1048;
      font-size: 1rem; font-weight: 600; padding: 0.9rem 0.2rem;
      cursor: pointer; transition: background 0.15s ease, transform 0.1s ease;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.95); background: #ffb6d5; }
    .btn-operator { background: #ff4da6; color: #fff; }
    .btn-function { background: #ff85b8; color: #fff; font-size: 0.9rem; }
    .btn-science { background: #ff69b4; color: #fff; font-size: 0.85rem; }
    .btn-science.active { background: #ff1493; }
    .btn-equals { background: linear-gradient(135deg, #ff1493, #e91e8c); color: #fff; font-weight: 700; font-size: 1.2rem; }
    .btn-second { background: #ff85b8; color: #fff; }
    .btn-zero { grid-column: span 2; }
    @media (min-width: 768px) {
      .calculator { max-width: 560px; }
      .result { font-size: 2.75rem; }
      .btn { padding: 1rem 0.2rem; font-size: 1.05rem; }
      .btn-science { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <header class="calculator-header">
      <div class="logo">
        <div class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="3" width="14" height="18" rx="2.5" stroke="white" stroke-width="1.5"/>
            <text x="12" y="11.5" text-anchor="middle" fill="white" font-size="7" font-weight="700" font-family="system-ui,sans-serif">A</text>
            <circle cx="8" cy="16" r="1" fill="white"/>
            <circle cx="12" cy="16" r="1" fill="white"/>
            <circle cx="16" cy="16" r="1" fill="white"/>
            <rect x="8" y="18.5" width="8" height="1.2" rx="0.6" fill="white"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-title">Aina's Calculator</div>
          <div class="logo-subtitle">Scientific</div>
        </div>
      </div>
      <div class="header-controls">
        <span class="second-indicator" id="secondIndicator"></span>
        <button class="mode-toggle active" id="angleMode" type="button">DEG</button>
      </div>
    </header>
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keypad" id="keypad"></div>
  </div>
  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');
    const secondIndicator = document.getElementById('secondIndicator');
    const angleModeBtn = document.getElementById('angleMode');
    const keypad = document.getElementById('keypad');

    let expression = '0';
    let lastResult = '0';
    let useRadians = false;
    let secondMode = false;

    const BUTTONS = [
      { label: '2nd', type: 'second', action: 'second' },
      { label: '(', type: 'science', action: 'insert', value: '(' },
      { label: ')', type: 'science', action: 'insert', value: ')' },
      { label: '⌫', type: 'function', action: 'backspace' },
      { label: 'AC', type: 'function', action: 'clear' },

      { label: 'sin', type: 'science', action: 'func', value: 'sin', alt: 'asin' },
      { label: 'cos', type: 'science', action: 'func', value: 'cos', alt: 'acos' },
      { label: 'tan', type: 'science', action: 'func', value: 'tan', alt: 'atan' },
      { label: 'log', type: 'science', action: 'func', value: 'log' },
      { label: '÷', type: 'operator', action: 'insert', value: '/' },

      { label: 'x²', type: 'science', action: 'square' },
      { label: 'xʸ', type: 'science', action: 'insert', value: '^' },
      { label: '√', type: 'science', action: 'func', value: 'sqrt' },
      { label: 'ln', type: 'science', action: 'func', value: 'ln' },
      { label: '×', type: 'operator', action: 'insert', value: '*' },

      { label: 'π', type: 'science', action: 'insert', value: 'π' },
      { label: 'e', type: 'science', action: 'insert', value: 'e' },
      { label: 'n!', type: 'science', action: 'factorial' },
      { label: '1/x', type: 'science', action: 'reciprocal' },
      { label: '−', type: 'operator', action: 'insert', value: '-' },

      { label: '7', type: 'number', action: 'insert', value: '7' },
      { label: '8', type: 'number', action: 'insert', value: '8' },
      { label: '9', type: 'number', action: 'insert', value: '9' },
      { label: '%', type: 'function', action: 'percent' },
      { label: '+', type: 'operator', action: 'insert', value: '+' },

      { label: '4', type: 'number', action: 'insert', value: '4' },
      { label: '5', type: 'number', action: 'insert', value: '5' },
      { label: '6', type: 'number', action: 'insert', value: '6' },
      { label: '±', type: 'function', action: 'toggleSign' },
      { label: '×', type: 'operator', action: 'insert', value: '*' },

      { label: '1', type: 'number', action: 'insert', value: '1' },
      { label: '2', type: 'number', action: 'insert', value: '2' },
      { label: '3', type: 'number', action: 'insert', value: '3' },
      { label: '.', type: 'number', action: 'insert', value: '.' },
      { label: '÷', type: 'operator', action: 'insert', value: '/' },

      { label: '0', type: 'number zero', action: 'insert', value: '0', span: 2 },
      { label: '=', type: 'equals', action: 'equals', span: 3 },
    ];

    function renderKeypad() {
      keypad.innerHTML = '';
      BUTTONS.forEach((btn) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `btn btn-${btn.type === 'number' || btn.type === 'zero' ? 'number' : btn.type}`;
        if (btn.type === 'second' && secondMode) el.classList.add('active');
        if (btn.action === 'func' && secondMode && btn.alt) {
          el.textContent = btn.alt;
        } else {
          el.textContent = btn.label;
        }
        if (btn.span) el.style.gridColumn = `span ${btn.span}`;
        if (btn.rowSpan) el.style.gridRow = `span ${btn.rowSpan}`;
        el.addEventListener('click', () => handleButton(btn));
        keypad.appendChild(el);
      });
    }

    function toDisplay(expr) {
      return expr
        .replace(/\*/g, '×')
        .replace(/\//g, '÷')
        .replace(/asin/g, 'sin⁻¹')
        .replace(/acos/g, 'cos⁻¹')
        .replace(/atan/g, 'tan⁻¹')
        .replace(/sqrt/g, '√')
        .replace(/\^/g, '^');
    }

    function updateDisplay() {
      expressionEl.textContent = expression === '0' ? '' : toDisplay(expression);
      secondIndicator.textContent = secondMode ? '2nd' : '';
      try {
        const val = evaluate(expression);
        if (!Number.isNaN(val) && Number.isFinite(val)) {
          resultEl.textContent = formatNumber(val);
          lastResult = String(val);
        } else {
          resultEl.textContent = formatNumber(parseFloat(lastResult) || 0);
        }
      } catch {
        resultEl.textContent = expression.length > 1 ? '…' : formatNumber(parseFloat(lastResult) || 0);
      }
    }

    function formatNumber(num) {
      if (!Number.isFinite(num)) return 'Error';
      const rounded = Math.round(num * 1e10) / 1e10;
      const str = String(rounded);
      const parts = str.split('.');
      const intFormatted = parseInt(parts[0], 10).toLocaleString('id-ID');
      return parts.length > 1 ? `${intFormatted},${parts[1]}` : intFormatted;
    }

    function shouldReplace(expr) {
      return expr === '0' || expr === 'Error';
    }

    function appendValue(value) {
      if (shouldReplace(expression) && !'(.'.includes(value)) {
        expression = value === '.' ? '0.' : value;
      } else {
        expression += value;
      }
      updateDisplay();
    }

    function appendFunction(name) {
      const prefix = shouldReplace(expression) ? '' : (endsWithValue(expression) ? '*' : '');
      if (shouldReplace(expression)) expression = '';
      expression += prefix + name + '(';
      updateDisplay();
    }

    function endsWithValue(expr) {
      return /[\d)πe!]$/.test(expr);
    }

    function handleButton(btn) {
      switch (btn.action) {
        case 'second':
          secondMode = !secondMode;
          renderKeypad();
          updateDisplay();
          break;
        case 'clear':
          expression = '0';
          updateDisplay();
          break;
        case 'backspace':
          expression = expression.length <= 1 ? '0' : expression.slice(0, -1);
          updateDisplay();
          break;
        case 'insert':
          appendValue(btn.value);
          break;
        case 'func': {
          const fnName = secondMode && btn.alt ? btn.alt : btn.value;
          if (secondMode) { secondMode = false; renderKeypad(); }
          appendFunction(fnName);
          break;
        }
        case 'square':
          if (shouldReplace(expression)) return;
          expression = '(' + expression + ')^2';
          updateDisplay();
          break;
        case 'factorial':
          if (shouldReplace(expression)) return;
          expression += '!';
          updateDisplay();
          break;
        case 'reciprocal':
          expression = shouldReplace(expression) ? '0' : expression;
          expression = '1/(' + expression + ')';
          updateDisplay();
          break;
        case 'percent':
          try {
            const val = evaluate(expression) / 100;
            expression = String(Math.round(val * 1e10) / 1e10);
            updateDisplay();
          } catch { /* ignore */ }
          break;
        case 'toggleSign':
          try {
            const val = -evaluate(expression);
            expression = String(Math.round(val * 1e10) / 1e10);
            updateDisplay();
          } catch { /* ignore */ }
          break;
        case 'equals':
          try {
            const val = evaluate(expression);
            if (!Number.isFinite(val)) throw new Error();
            expressionEl.textContent = toDisplay(expression) + ' =';
            expression = String(Math.round(val * 1e10) / 1e10);
            lastResult = expression;
            resultEl.textContent = formatNumber(val);
          } catch {
            resultEl.textContent = 'Error';
            expression = 'Error';
          }
          break;
      }
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n > 170) return Infinity;
      let r = 1;
      for (let i = 2; i <= n; i++) r *= i;
      return r;
    }

    function toAngle(x) { return useRadians ? x : x * Math.PI / 180; }
    function fromAngle(x) { return useRadians ? x : x * 180 / Math.PI; }

    function tokenize(input) {
      const tokens = [];
      let i = 0;
      while (i < input.length) {
        const ch = input[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/[\d.]/.test(ch)) {
          let num = ch;
          i++;
          while (i < input.length && /[\d.]/.test(input[i])) num += input[i++];
          tokens.push({ type: 'num', value: parseFloat(num) });
          continue;
        }
        if ('+-*/^()!,'.includes(ch)) {
          tokens.push({ type: ch === ',' ? 'num' : 'op', value: ch });
          i++;
          continue;
        }
        if (input.slice(i, i + 2) === 'pi' || input[i] === 'π') {
          tokens.push({ type: 'num', value: Math.PI });
          i += input[i] === 'π' ? 1 : 2;
          continue;
        }
        if (input[i] === 'e' && !/[a-z]/.test(input[i + 1] || '')) {
          tokens.push({ type: 'num', value: Math.E });
          i++;
          continue;
        }
        const funcs = ['asin', 'acos', 'atan', 'sin', 'cos', 'tan', 'log', 'ln', 'sqrt'];
        const found = funcs.find(f => input.slice(i, i + f.length) === f);
        if (found) {
          tokens.push({ type: 'func', value: found });
          i += found.length;
          continue;
        }
        throw new Error('Invalid');
      }
      return tokens;
    }

    function parse(tokens) {
      let pos = 0;

      function peek() { return tokens[pos]; }
      function consume() { return tokens[pos++]; }

      function parseExpression() {
        let left = parseTerm();
        while (peek() && (peek().value === '+' || peek().value === '-')) {
          const op = consume().value;
          const right = parseTerm();
          left = op === '+' ? left + right : left - right;
        }
        return left;
      }

      function parseTerm() {
        let left = parsePower();
        while (peek() && (peek().value === '*' || peek().value === '/')) {
          const op = consume().value;
          const right = parsePower();
          left = op === '*' ? left * right : left / right;
        }
        return left;
      }

      function parsePower() {
        let left = parseUnary();
        while (peek() && peek().value === '^') {
          consume();
          const right = parseUnary();
          left = Math.pow(left, right);
        }
        return left;
      }

      function parseUnary() {
        if (peek()?.value === '-') {
          consume();
          return -parseUnary();
        }
        return parseFactorial();
      }

      function parseFactorial() {
        let left = parsePrimary();
        while (peek()?.value === '!') {
          consume();
          left = factorial(left);
        }
        return left;
      }

      function parsePrimary() {
        const token = peek();
        if (!token) throw new Error('Unexpected end');

        if (token.type === 'num' && typeof token.value === 'number') {
          consume();
          return token.value;
        }

        if (token.type === 'func') {
          const fn = consume().value;
          if (peek()?.value !== '(') throw new Error('Expected (');
          consume();
          const arg = parseExpression();
          if (peek()?.value !== ')') throw new Error('Expected )');
          consume();
          switch (fn) {
            case 'sin': return Math.sin(toAngle(arg));
            case 'cos': return Math.cos(toAngle(arg));
            case 'tan': return Math.tan(toAngle(arg));
            case 'asin': return fromAngle(Math.asin(arg));
            case 'acos': return fromAngle(Math.acos(arg));
            case 'atan': return fromAngle(Math.atan(arg));
            case 'log': return Math.log10(arg);
            case 'ln': return Math.log(arg);
            case 'sqrt': return Math.sqrt(arg);
            default: throw new Error('Unknown func');
          }
        }

        if (token.value === '(') {
          consume();
          const val = parseExpression();
          if (peek()?.value !== ')') throw new Error('Expected )');
          consume();
          return val;
        }

        throw new Error('Invalid token');
      }

      const result = parseExpression();
      if (pos < tokens.length) throw new Error('Trailing tokens');
      return result;
    }

    function evaluate(expr) {
      if (!expr || expr === 'Error') throw new Error();
      const normalized = expr.replace(/π/g, 'pi');
      const tokens = tokenize(normalized);
      if (!tokens.length) return 0;
      return parse(tokens);
    }

    angleModeBtn.addEventListener('click', () => {
      useRadians = !useRadians;
      angleModeBtn.textContent = useRadians ? 'RAD' : 'DEG';
      angleModeBtn.classList.toggle('active', !useRadians);
      updateDisplay();
    });

    renderKeypad();
    updateDisplay();
  </script>
</body>
</html>
