name: Build Android APK

on:
  push:
    branches: [master, cursor/**]
    paths:
      - 'android/**'
      - 'docs/photo-enhancer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to releases
        run: |
          mkdir -p docs/releases
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/releases/FotoJelasPro.apk
          ls -lh docs/releases/FotoJelasPro.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases/FotoJelasPro.apk
          git diff --staged --quiet || git commit -m "ci: update FotoJelasPro.apk debug build"
          git push
